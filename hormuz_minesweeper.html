<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hormuz Minesweeper</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div id="gw">
    <div id="hdr">
      <div class="lcd" id="mc">045</div>
      <div id="diff-btns">
        <button class="dbtn active" data-d="easy">Leicht</button>
        <button class="dbtn" data-d="medium">Mittel</button>
        <button class="dbtn" data-d="hard">Schwer</button>
      </div>
      <button id="sb">🙂</button>
      <button id="dn-btn" title="Tag/Nacht">☀️</button>
      <div class="lcd" id="tm">000</div>
    </div>
    <div id="cc">
      <canvas id="gc"></canvas>
      <div id="ov">
        <div id="ot"></div>
        <div id="os">Klick zum Neustart</div>
      </div>
    </div>
    <div id="hs-panel">
      <div id="hs-title">⚓ Bestzeiten</div>
      <div id="hs-list"></div>
    </div>
    <div id="st">L-Klick: aufdecken | R-Klick: Flagge/? | Chord: Zahl klicken wenn Flaggen gesetzt</div>
  </div>

  <script src="game.js"></script>
</body>

</html>
