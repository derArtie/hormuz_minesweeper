<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hormuz Minesweeper</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
    }

    #gw {
      background: #1a2530;
      padding: 12px;
      border-radius: 10px;
      user-select: none;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      font-family: 'Courier New', monospace;
      transition: background 0.4s;
    }

    #gw.day {
      background: #b8cfe0;
    }

    #hdr {
      background: #0f1a24;
      border: 2px inset #060e14;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      border-radius: 6px;
      gap: 6px;
      transition: background 0.4s;
    }

    #gw.day #hdr {
      background: #1e3a55;
      border-color: #2a5070;
    }

    .lcd {
      background: #0a0a0a;
      color: #ff2200;
      font-size: 22px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 3px;
      min-width: 58px;
      text-align: center;
      letter-spacing: 2px;
      border: 1px inset #333;
    }

    #sb {
      font-size: 22px;
      background: #b0b0b0;
      border: 3px outset #ddd;
      border-radius: 4px;
      cursor: pointer;
      padding: 1px 6px;
      line-height: 1.2;
      flex-shrink: 0;
    }

    #sb:active {
      border-style: inset;
    }

    #diff-btns {
      display: flex;
      gap: 3px;
    }

    .dbtn {
      background: #1e3a50;
      border: 1px solid #2a5570;
      color: #7ab8d8;
      font-size: 10px;
      font-family: 'Courier New', monospace;
      padding: 3px 6px;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .dbtn:hover {
      background: #2a5070;
    }

    .dbtn.active {
      background: #0d5a8a;
      border-color: #2a90c0;
      color: #c0e8ff;
    }

    #dn-btn {
      background: #1e3a50;
      border: 1px solid #2a5570;
      color: #f0d060;
      font-size: 14px;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #cc {
      position: relative;
      border: 2px inset #060e14;
      overflow: hidden;
      border-radius: 3px;
      width: 100%;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    #ov {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.78);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      cursor: default;
    }

    #ov.show {
      display: flex;
    }

    #ot {
      font-size: 26px;
      font-weight: bold;
    }

    #os {
      font-size: 11px;
      color: #999;
    }

    #hs-panel {
      background: #0a1520;
      border: 1px solid #1e3a50;
      border-radius: 6px;
      padding: 10px 14px;
      margin-top: 8px;
      transition: background 0.4s;
    }

    #gw.day #hs-panel {
      background: #1e3a55;
      border-color: #2a5878;
    }

    #hs-title {
      color: #5a9abf;
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    #hs-list {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 2px 12px;
    }

    .hs-entry {
      font-size: 10px;
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    #st {
      margin-top: 6px;
      text-align: center;
      color: #5a8aaa;
      font-size: 10px;
    }

    #gw.day #st {
      color: #7ab8d8;
    }
  </style>
</head>

            else {
              ctx.fillStyle = C.rev; ctx.fillRect(x, y, CELL, CELL);
              ctx.strokeStyle = 'rgba(0,40,70,0.15)'; ctx.lineWidth = 0.3; ctx.strokeRect(x, y, CELL, CELL);
              if (board[r][c] > 0) { ctx.fillStyle = NC[board[r][c]]; ctx.font = `bold ${CELL - 3}px 'Courier New'`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(board[r][c], x + CELL / 2, y + CELL / 2 + 1); }
            }
          }
        }

        const lc = dayMode ? 'rgba(50,28,4,0.95)' : 'rgba(245,215,160,0.95)';
        const wc = dayMode ? 'rgba(8,35,90,0.92)' : 'rgba(160,220,255,0.92)';

        drawLabel('Iran', lc, 11, 30, 5);
        drawLabel('Saudi-Arabien', lc, 9, 2, 26);
        drawLabel('Katar', lc, 9, 9, 25);
        drawLabel('VAE', lc, 10, 24, 34);
        drawLabel('Oman', lc, 10, 38, 37);
        drawLabel('Persischer Golf', wc, 9, 13, 22);
        // Straße von Hormuz weiter rechts — in der echten Meeresenge bei col 33
        drawLabel('Str. v. Hormuz', wc, 8, 35, 20);
        drawLabel('Golf von Oman', wc, 9, 50, 27);

        particles = particles.filter(p => p.life > 0);
        particles.forEach(p => {
          if (p.type === 'ring') { const rad = p.maxR * (1 - p.life); ctx.save(); ctx.strokeStyle = `rgba(255,180,60,${p.life * .8})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
          else { ctx.save(); ctx.globalAlpha = p.life; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); ctx.restore(); p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.97; }
          p.life -= p.decay;
        });

        if (showShip()) {
          canvas.style.cursor = 'none';
          ctx.font = `${CELL + 4}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🚢', mouseX, mouseY);
        } else {
          canvas.style.cursor = 'default';
        }

        const { r: cr, c: cc } = mouseCell;
        if (cr >= 0 && cr < ROWS && cc >= 0 && cc < COLS && revealed[cr] && revealed[cr][cc] && board[cr] && board[cr][cc] > 0) {
          let f = 0; for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const nr = cr + dr, nc = cc + dc; if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && flagged[nr][nc]) f++; }
          if (f === board[cr][cc]) { ctx.save(); ctx.strokeStyle = 'rgba(255,220,50,0.8)'; ctx.lineWidth = 1.5; ctx.strokeRect(cc * CELL + 1, cr * CELL + 1, CELL - 2, CELL - 2); ctx.restore(); }
        }

        waveT += 0.04;
        requestAnimationFrame(drawFrame);
      }

      function getCell(e) {
        const rect = canvas.getBoundingClientRect();
        // Use rendered pixel size for correct mapping when canvas is scaled
        const sx = canvas.width / rect.width, sy = canvas.height / rect.height;
        return { c: Math.floor((e.clientX - rect.left) * sx / CELL), r: Math.floor((e.clientY - rect.top) * sy / CELL), px: (e.clientX - rect.left) * sx, py: (e.clientY - rect.top) * sy };
      }
      canvas.addEventListener('mousemove', e => { const { r, c, px, py } = getCell(e); mouseX = px; mouseY = py; mouseCell = { r, c }; });
      canvas.addEventListener('mouseleave', () => { mouseCell = { r: -1, c: -1 }; canvas.style.cursor = 'default'; });

      function handleLost() {
        gs = 'lost'; clearInterval(ti);
        for (let mr = 0; mr < ROWS; mr++) for (let mc = 0; mc < COLS; mc++) if (board[mr][mc] === -1) revealed[mr][mc] = true;
        document.getElementById('sb').textContent = '😵';
        const ot = document.getElementById('ot'); ot.textContent = 'BOOM! 💥'; ot.style.color = '#ff5544';
        setTimeout(() => document.getElementById('ov').classList.add('show'), 900);
      }
      function handleWon() {
        gs = 'won'; clearInterval(ti); saveScore(currentDiff, tv);
        document.getElementById('sb').textContent = '😎';
        const ot = document.getElementById('ot'); ot.textContent = `GEWONNEN! 🎉 ${tv}s`; ot.style.color = DIFFS[currentDiff].color;
        document.getElementById('ov').classList.add('show');
      }

      canvas.addEventListener('click', e => {
        e.preventDefault();
        if (gs === 'won' || gs === 'lost') { init(); return; }
        const { r, c } = getCell(e);
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
        if (P[r][c] && revealed[r][c] && board[r] && board[r][c] > 0 && gs === 'playing') {
          chordReveal(r, c);
          let hit = false;
          for (let mr = 0; mr < ROWS; mr++) for (let mc = 0; mc < COLS; mc++) if (revealed[mr][mc] && board[mr][mc] === -1) { hit = true; spawnExplosion(mr, mc); }
          if (hit) { handleLost(); return; }
          if (checkWin()) handleWon();
          return;
        }
        if (!P[r][c] || flagged[r][c] || qmark[r][c] || revealed[r][c]) return;
        if (fc) {
          fc = false; gs = 'playing'; placeMines(r, c);
          ti = setInterval(() => { tv = Math.min(999, tv + 1); document.getElementById('tm').textContent = String(tv).padStart(3, '0'); }, 1000);
        }
        if (board[r][c] === -1) { revealed[r][c] = true; spawnExplosion(r, c); handleLost(); }
        else { reveal(r, c); if (checkWin()) handleWon(); }
      });

      canvas.addEventListener('contextmenu', e => {
        e.preventDefault();
        if (gs === 'won' || gs === 'lost') return;
        const { r, c } = getCell(e);
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || !P[r][c] || revealed[r][c]) return;
        if (!flagged[r][c] && !qmark[r][c]) flagged[r][c] = true;
        else if (flagged[r][c]) { flagged[r][c] = false; qmark[r][c] = true; }
        else qmark[r][c] = false;
        document.getElementById('mc').textContent = String(mineCount - flagCount()).padStart(3, '0');
      });

      document.getElementById('ov').addEventListener('click', init);
      document.getElementById('sb').addEventListener('click', init);
      document.getElementById('dn-btn').addEventListener('click', () => {
        dayMode = !dayMode;
        document.getElementById('gw').classList.toggle('day', dayMode);
        document.getElementById('dn-btn').textContent = dayMode ? '🌙' : '☀️';
      });
      document.querySelectorAll('.dbtn').forEach(btn => {
        btn.addEventListener('click', () => { currentDiff = btn.dataset.d; document.querySelectorAll('.dbtn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); init(); });
      });

      // Full-width: canvas always fills container, no fixed scaling
      function resize() {
        // canvas CSS is width:100%, height:auto — nothing to do here
        // but re-render to ensure crisp drawing
      }
      window.addEventListener('resize', resize);
      init();
      drawFrame();
    })();
  </script>
</body>
