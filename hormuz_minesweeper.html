  <title>Hormuz Minesweeper</title>

* { box-sizing: border-box; margin: 0; padding: 0; }
#gw { background: #1a2a3a; padding: 12px; border-radius: 8px; user-select: none; max-width: 740px; margin: 0 auto; }
#hdr { background: #2a3a4a; border: 2px inset #111; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-radius: 4px; }

#cc { position: relative; border: 2px inset #111; overflow: hidden; border-radius: 3px; }
canvas { display: block; }
#ov { display: none; position: absolute; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,0.72); align-items:center; justify-content:center; flex-direction:column; gap:12px; }
#ov.show { display: flex; }
#ot { font-size: 28px; font-weight: bold; font-family: 'Courier New', monospace; }
#os { font-size: 12px; color: #aaa; font-family: 'Courier New', monospace; }
#st { margin-top: 7px; text-align: center; color: #7aaccc; font-size: 11px; font-family: 'Courier New', monospace; }
</style>
</head>

const L = Array.from({length:ROWS}, (_,r) => Array.from({length:COLS}, (_,c) => RAW[r*COLS+c]===1));

const waterCells=[];
for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(!L[r][c]) waterCells.push({r,c});

const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
canvas.width=COLS*CELL; canvas.height=ROWS*CELL;

let board,revealed,flagged,gs,tv,ti,fc;

function init(){
  board=Array.from({length:ROWS},()=>new Array(COLS).fill(0));
  revealed=Array.from({length:ROWS},()=>new Array(COLS).fill(false));
  flagged=Array.from({length:ROWS},()=>new Array(COLS).fill(false));
  gs='idle'; tv=0; fc=true;
  clearInterval(ti);
  document.getElementById('tm').textContent='000';
  document.getElementById('mc').textContent=String(MINES).padStart(3,'0');
  document.getElementById('sb').textContent='🙂';
  document.getElementById('ov').classList.remove('show');
  draw();
}

function placeMines(er,ec){
  const pool=waterCells.filter(({r,c})=>!(r===er&&c===ec));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  for(let i=0;i<MINES;i++) board[pool[i].r][pool[i].c]=-1;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(board[r][c]===-1) continue;
    let n=0;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr][nc]===-1) n++;
    }
    board[r][c]=n;
  }
}

const NC=['','#1a5fbf','#2e7d32','#c62828','#1a237e','#7b1fa2','#00838f','#3e2723','#555'];

function draw(){
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const x=c*CELL, y=r*CELL;
    const isL=L[r][c], isR=revealed[r][c], isF=flagged[r][c];
    if(isL){
      ctx.fillStyle=(r+c)%2===0?'#8a7052':'#7a6042';
      ctx.fillRect(x,y,CELL,CELL);
      ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=0.3;
      ctx.strokeRect(x,y,CELL,CELL);
    } else if(!isR){
      ctx.fillStyle=(r+c)%2===0?'#0d5a96':'#0a4f88';
      ctx.fillRect(x,y,CELL,CELL);
      ctx.fillStyle='rgba(255,255,255,0.1)';
      ctx.fillRect(x,y,CELL,2); ctx.fillRect(x,y,2,CELL);
      ctx.fillStyle='rgba(0,0,0,0.18)';
      ctx.fillRect(x,y+CELL-2,CELL,2); ctx.fillRect(x+CELL-2,y,2,CELL);
      if(isF){
        ctx.font=`${CELL}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🚩',x+CELL/2,y+CELL/2+1);
      }
    } else {
      if(board[r][c]===-1){
        ctx.fillStyle='#b71c1c'; ctx.fillRect(x,y,CELL,CELL);
        ctx.font=`${CELL}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('💣',x+CELL/2,y+CELL/2+1);
      } else {
        ctx.fillStyle='#3d8fba'; ctx.fillRect(x,y,CELL,CELL);
        ctx.strokeStyle='rgba(0,50,90,0.2)'; ctx.lineWidth=0.3;
        ctx.strokeRect(x,y,CELL,CELL);
        if(board[r][c]>0){
          ctx.fillStyle=NC[board[r][c]];
          ctx.font=`bold ${CELL-2}px 'Courier New'`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(board[r][c],x+CELL/2,y+CELL/2+1);
        }
      }
    }
  }
  // Place labels
  const labels=[
    {t:'Iran',r:8,c:30,col:'rgba(240,210,150,0.9)',size:11},
    {t:'Persischer Golf',r:21,c:14,col:'rgba(160,220,255,0.85)',size:9},
    {t:'Str. v. Hormuz',r:21,c:33,col:'rgba(160,220,255,0.85)',size:8},
    {t:'Golf von Oman',r:28,c:50,col:'rgba(160,220,255,0.85)',size:9},
    {t:'Bandar Abbas',r:16.5,c:22,col:'rgba(240,210,150,0.85)',size:7},
    {t:'UAE',r:28,c:21,col:'rgba(240,210,150,0.85)',size:9},
    {t:'Oman',r:35,c:37,col:'rgba(240,210,150,0.85)',size:9},
    {t:'Qatar',r:24,c:7,col:'rgba(240,210,150,0.85)',size:8},
    {t:'Kish',r:20.5,c:25.5,col:'rgba(240,210,150,0.8)',size:7},
    {t:'Qeshm',r:20.5,c:33,col:'rgba(240,210,150,0.8)',size:7},
    {t:'Musandam',r:30,c:29,col:'rgba(240,210,150,0.8)',size:7},
  ];
  labels.forEach(({t,r,c,col,size})=>{
    ctx.font=`bold ${size}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillText(t,c*CELL+1,r*CELL+1);
    ctx.fillStyle=col;
    ctx.fillText(t,c*CELL,r*CELL);
  });
}

function reveal(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS) return;
  if(revealed[r][c]||flagged[r][c]||L[r][c]) return;
  revealed[r][c]=true;
  if(board[r][c]===0) for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) reveal(r+dr,c+dc);
}
function flagCount(){let f=0;for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(flagged[r][c]) f++;return f;}
function checkWin(){for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) if(!L[r][c]&&board[r][c]!==-1&&!revealed[r][c]) return false;return true;}

function getCell(e){
  const rect=canvas.getBoundingClientRect();
  return {
    c: Math.floor((e.clientX-rect.left)*canvas.width/rect.width/CELL),
    r: Math.floor((e.clientY-rect.top)*canvas.height/rect.height/CELL)
  };
}

canvas.addEventListener('click',e=>{
  e.preventDefault();
  if(gs==='won'||gs==='lost'){init();return;}
  const {r,c}=getCell(e);
  if(r<0||r>=ROWS||c<0||c>=COLS||L[r][c]||flagged[r][c]||revealed[r][c]) return;
  if(fc){
    fc=false; gs='playing'; placeMines(r,c);
    ti=setInterval(()=>{tv=Math.min(999,tv+1);document.getElementById('tm').textContent=String(tv).padStart(3,'0');},1000);
  }
  if(board[r][c]===-1){
    gs='lost'; clearInterval(ti);
    for(let mr=0;mr<ROWS;mr++) for(let mc=0;mc<COLS;mc++) if(board[mr][mc]===-1) revealed[mr][mc]=true;
    draw();
    document.getElementById('sb').textContent='😵';
    const ot=document.getElementById('ot'); ot.textContent='BOOM! 💥'; ot.style.color='#ff5544';
    document.getElementById('ov').classList.add('show');
  } else {
    reveal(r,c); draw();
    if(checkWin()){
      gs='won'; clearInterval(ti);
      document.getElementById('sb').textContent='😎';
      const ot=document.getElementById('ot'); ot.textContent='GEWONNEN! 🎉'; ot.style.color='#44ee88';
      document.getElementById('ov').classList.add('show');
    }
  }
});

canvas.addEventListener('contextmenu',e=>{
  e.preventDefault();
  if(gs==='won'||gs==='lost') return;
  const {r,c}=getCell(e);
  if(r<0||r>=ROWS||c<0||c>=COLS||L[r][c]||revealed[r][c]) return;
  flagged[r][c]=!flagged[r][c];
  document.getElementById('mc').textContent=String(MINES-flagCount()).padStart(3,'0');
  draw();
});

document.getElementById('ov').addEventListener('click',init);
document.getElementById('sb').addEventListener('click',init);

function resize(){
  const w=document.getElementById('gw').clientWidth-28;
  const sc=Math.min(1,w/canvas.width);
  canvas.style.width=(canvas.width*sc)+'px';
  canvas.style.height=(canvas.height*sc)+'px';
}
window.addEventListener('resize',()=>{resize();draw();});
resize();
init();
})();
</script>
</body>
</html>
